networks:
  superpalpite_net:
    name: superpalpite_net

services:
  superpalpite_app:
    build:
      context: ./app
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
    container_name: superpalpite_app
    restart: unless-stopped
    ports:
      - "3010:3000"
    env_file: .env
    networks:
      - superpalpite_net

  cleanup_cron:
    image: curlimages/curl:latest
    container_name: superpalpite_cleanup
    restart: unless-stopped
    env_file: .env
    networks:
      - superpalpite_net
    depends_on:
      - superpalpite_app
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          curl -s -X POST http://superpalpite_app:3000/api/cron/cleanup-pending \
            -H "x-cron-secret: $$CRON_SECRET" \
            && echo "[cleanup] OK" || echo "[cleanup] falhou"
          sleep 1800
        done
